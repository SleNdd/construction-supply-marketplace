openapi: 3.0.3
info:
  title: ОбъектМаркет API
  version: 1.0.0
  description: 'API учебной системы закупки строительных материалов. Суммы — в копейках; реальные платежи и GPS отсутствуют. Демонстрационная доставка доступна только для строк адреса вида «Астрахань, улица, дом» или «г. Астрахань, улица, дом».'
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: om_session
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [buyer, supplier, dispatcher, driver, admin]}
    CartItem:
      type: object
      required: [offerId, quantity]
      properties:
        offerId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 10000}
    Purchase:
      type: object
      required: [items, address]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/CartItem'}
        address: {type: string, description: 'Учебный адрес: «Астрахань, улица, дом» или «г. Астрахань, улица, дом»'}
        requestedDate: {type: string, format: date, description: 'Календарная дата доставки; прошлые даты и минимальный срок проверяются по часовому поясу Астрахани'}
        projectId: {type: string, format: uuid}
    Product:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        category: {type: string}
        categoryId: {type: string, format: uuid}
        unit: {type: string}
        packaging: {$ref: '#/components/schemas/Packaging'}
        imageUrl: {type: string, nullable: true}
        description: {type: string}
        specs: {type: object, additionalProperties: true}
        offers: {type: array, description: Предложения включены только в карточку товара, items: {$ref: '#/components/schemas/Offer'}}
        priceFromKopecks: {type: integer, nullable: true, description: 'Минимальная цена активных предложений; при inStock=true учитываются только предложения с stock > 0. null, если подходящих предложений нет.'}
    Packaging:
      description: 'Структурированная фасовка или null. tiles — коробка, paint — ведро, dry-mix — мешок. Все предложения товара используют эту фасовку.'
      type: object
      nullable: true
      oneOf:
        - type: object
          nullable: true
          enum: [null]
        - type: object
          additionalProperties: false
          required: [kind, tileAreaM2, tilesPerPack]
          properties:
            kind: {type: string, enum: [tiles]}
            tileAreaM2: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
            tilesPerPack: {type: integer, minimum: 1, maximum: 1000000000}
        - type: object
          additionalProperties: false
          required: [kind, packSizeL]
          properties:
            kind: {type: string, enum: [paint]}
            packSizeL: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
        - type: object
          additionalProperties: false
          required: [kind, packSizeKg]
          properties:
            kind: {type: string, enum: [dry-mix]}
            packSizeKg: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
    MaterialInputs:
      description: 'Набор должен соответствовать kind. Неизвестные поля, фасовка клиента и null в числах отклоняются. Запас по умолчанию 10%, слои 2.'
      oneOf:
        - type: object
          additionalProperties: false
          required: [areaM2]
          properties:
            areaM2: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
            wastePercent: {type: number, minimum: 0, maximum: 1000000000, default: 10}
        - type: object
          additionalProperties: false
          required: [areaM2, rateLPerM2]
          properties:
            areaM2: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
            rateLPerM2: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
            coats: {type: integer, minimum: 1, maximum: 1000000000, default: 2}
            wastePercent: {type: number, minimum: 0, maximum: 1000000000, default: 10}
        - type: object
          additionalProperties: false
          required: [areaM2, layerMm, rateKgPerM2Mm]
          properties:
            areaM2: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
            layerMm: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
            rateKgPerM2Mm: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
            wastePercent: {type: number, minimum: 0, maximum: 1000000000, default: 10}
    MaterialRequest:
      type: object
      additionalProperties: false
      required: [productId, kind, inputs]
      properties:
        productId: {type: string, format: uuid}
        kind: {type: string, enum: [tiles, paint, dry-mix]}
        inputs: {$ref: '#/components/schemas/MaterialInputs'}
    FromCalculationRequest:
      type: object
      additionalProperties: false
      required: [productId, kind, inputs]
      properties:
        productId: {type: string, format: uuid}
        kind: {type: string, enum: [tiles, paint, dry-mix]}
        inputs: {$ref: '#/components/schemas/MaterialInputs'}
        stageDate: {type: string, format: date, nullable: true}
    MaterialCalculation:
      allOf:
        - {$ref: '#/components/schemas/Calculation'}
        - type: object
          properties:
            productId: {type: string, format: uuid}
            unit: {type: string}
            packaging: {$ref: '#/components/schemas/Packaging'}
            coverage: {type: number, minimum: 0, exclusiveMinimum: true}
            coverageUnit: {type: string, enum: [м², л, кг]}
    FromCalculationResponse:
      type: object
      required: [item, calculation]
      properties:
        item:
          type: object
          properties:
            id: {type: string, format: uuid}
            productId: {type: string, format: uuid}
            productName: {type: string}
            unit: {type: string}
            quantity: {type: integer, minimum: 1, maximum: 1000000}
            stageDate: {type: string, format: date, nullable: true}
        calculation: {$ref: '#/components/schemas/MaterialCalculation'}
    Offer:
      type: object
      properties:
        id: {type: string, format: uuid}
        supplierId: {type: string, format: uuid}
        supplierName: {type: string}
        warehouseId: {type: string, format: uuid}
        warehouseName: {type: string}
        warehouseAddress: {type: string}
        priceKopecks: {type: integer}
        stock: {type: integer}
        deliveryDays: {type: integer}
        earliestDeliveryDate: {type: string, format: date, description: 'Предварительная ближайшая дата по календарю Астрахани, вычисленная сервером при чтении карточки'}
        deliveryCostKopecks: {type: integer}
    Order:
      type: object
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [awaiting_payment, paid, in_progress, delivered, cancelled, expired]}
        reservationExpiresAt: {type: string, format: date-time, nullable: true, description: 'Через 30 минут неоплаченный резерв освобождается'}
        itemsTotalKopecks: {type: integer}
        deliveryTotalKopecks: {type: integer}
        totalKopecks: {type: integer}
        items: {type: array, items: {type: object}}
        deliveries: {type: array, items: {type: object}}
        paymentMode: {type: string, enum: [demo]}
        trackingMode: {type: string, enum: [demo]}
    Calculation:
      type: object
      properties:
        formula: {type: string}
        calculatedConsumption: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
        consumptionUnit: {type: string}
        packages: {type: integer, minimum: 1, maximum: 1000000}
        packSize: {type: number}
  responses:
    Error:
      description: Ошибка с кодом и сообщением
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
paths:
  /health:
    get:
      summary: Проверка работоспособности API
      responses: {'200': {description: API доступен}}
  /auth/register:
    post:
      summary: Регистрация покупателя и создание сеанса
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: {type: string}
                email: {type: string, format: email}
                password: {type: string, minLength: 10}
      responses: {'201': {description: Пользователь и HttpOnly cookie}, '409': {$ref: '#/components/responses/Error'}}
  /auth/login:
    post:
      summary: Вход
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses: {'201': {description: Пользователь и HttpOnly cookie}, '401': {$ref: '#/components/responses/Error'}}
  /auth/me:
    get:
      summary: Текущий пользователь
      security: [{session: []}]
      responses: {'200': {description: Пользователь}, '401': {$ref: '#/components/responses/Error'}}
  /auth/logout:
    post:
      summary: Завершить сеанс
      security: [{session: []}]
      responses: {'201': {description: Сеанс завершён}}
  /categories:
    get:
      summary: Категории товаров
      responses: {'200': {description: Список категорий}}
  /products:
    get:
      summary: Поиск и фильтрация товаров
      description: 'Фильтры q, category, диапазон цены и наличие сочетаются. Границы цены включены и применяются к priceFromKopecks. Товары без активных предложений остаются без фильтров цены и наличия, но исключаются при любой границе цены или inStock=true. total — число товаров после фильтров, до пагинации. Неверные значения фильтров и maxPriceKopecks < minPriceKopecks возвращают 400 с code=invalid_input.'
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [name, price_asc, price_desc]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: minPriceKopecks, in: query, description: 'Минимальная цена в целых неотрицательных копейках', schema: {type: integer, minimum: 0, maximum: 2147483647}}
        - {name: maxPriceKopecks, in: query, description: 'Максимальная цена в целых неотрицательных копейках', schema: {type: integer, minimum: 0, maximum: 2147483647}}
        - {name: inStock, in: query, description: 'true — только товары с активным предложением с stock > 0; false или отсутствие параметра — без ограничения наличия. При true цена и сортировка используют только предложения в наличии.', schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Страница товаров
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Product'}}
                  page: {type: integer}
                  total: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
  /products/{id}:
    get:
      summary: Товар и предложения поставщиков
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Карточка товара с offers}, '404': {$ref: '#/components/responses/Error'}}
  /supplier/offers:
    get:
      summary: Собственные предложения поставщика
      security: [{session: []}]
      responses: {'200': {description: Список предложений}}
    post:
      summary: Создать предложение
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, warehouseId, priceKopecks, stock, deliveryDays, deliveryCostKopecks]
              properties:
                productId: {type: string, format: uuid}
                warehouseId: {type: string, format: uuid}
                priceKopecks: {type: integer, minimum: 1}
                stock: {type: integer, minimum: 0}
                deliveryDays: {type: integer, minimum: 0}
                deliveryCostKopecks: {type: integer, minimum: 0}
      responses: {'201': {description: Новое предложение}, '403': {$ref: '#/components/responses/Error'}}
  /supplier/offers/{id}:
    patch:
      summary: Изменить своё предложение
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                priceKopecks: {type: integer, minimum: 1}
                stock: {type: integer, minimum: 0}
                deliveryDays: {type: integer, minimum: 0}
                deliveryCostKopecks: {type: integer, minimum: 0}
                active: {type: boolean}
      responses: {'200': {description: Изменённое предложение}, '404': {$ref: '#/components/responses/Error'}}
  /supplier/warehouses:
    get:
      summary: Склады текущего поставщика
      security: [{session: []}]
      responses: {'200': {description: Список складов}}
  /admin/categories:
    post:
      summary: Создать категорию, роль admin
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string}
                slug: {type: string}
      responses: {'201': {description: Категория создана}}
  /admin/categories/{id}:
    patch:
      summary: Изменить категорию, роль admin
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Категория изменена}}
  /admin/products:
    post:
      summary: Создать товар, роль admin
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, slug, name, unit]
              properties:
                categoryId: {type: string, format: uuid}
                slug: {type: string}
                name: {type: string}
                unit: {type: string}
                imageUrl: {type: string, nullable: true}
                description: {type: string}
                specs: {type: object, additionalProperties: true}
                packaging: {$ref: '#/components/schemas/Packaging'}
      responses: {'201': {description: Товар создан}}
  /admin/products/{id}:
    patch:
      summary: Изменить товар, роль admin
      description: 'Можно редактировать описание, название, фото и характеристики. Передача unit или packaging всегда даёт 400 immutable_packaging; для иной единицы или фасовки создаётся новый товар.'
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Товар изменён}}
  /quotes:
    post:
      summary: Рассчитать стоимость без резервирования
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Purchase'}}}
      responses: {'201': {description: 'Строки с earliestDeliveryDate (YYYY-MM-DD по календарю Астрахани), итоги, недоступные позиции, предупреждения и zoneAvailable для учебной зоны'}}
  /projects:
    get:
      summary: Объекты покупателя
      security: [{session: []}]
      responses:
        '200':
          description: Список объектов с числом позиций в каждом
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string, format: uuid}
                    name: {type: string}
                    address: {type: string}
                    stages: {type: array, items: {type: object}}
                    createdAt: {type: string, format: date-time}
                    itemCount: {type: integer, minimum: 0}
    post:
      summary: Создать объект
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name: {type: string}
                address: {type: string}
                stages: {type: array, items: {type: object}}
      responses: {'201': {description: Новый объект}}
  /projects/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Объект и список потребностей
      security: [{session: []}]
      responses: {'200': {description: Объект}, '404': {$ref: '#/components/responses/Error'}}
    patch:
      summary: Изменить свой объект
      security: [{session: []}]
      responses: {'200': {description: Изменённый объект}}
  /projects/{id}/items:
    post:
      summary: Добавить позицию потребности
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: {type: string, format: uuid}
                quantity: {type: integer, minimum: 1}
                stageDate: {type: string, format: date}
      responses: {'201': {description: Позиция добавлена}}
  /projects/{id}/items/{itemId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      summary: Изменить количество или дату потребности своего объекта
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                quantity: {type: integer, minimum: 1}
                stageDate: {type: string, format: date, nullable: true}
      responses:
        '200': {description: Изменённая позиция}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      summary: Удалить позицию потребности своего объекта
      security: [{session: []}]
      responses:
        '204': {description: Позиция удалена}
        '404': {$ref: '#/components/responses/Error'}
  /calculators/material:
    post:
      summary: Рассчитать потребность с фасовкой выбранного товара
      description: 'Публичный preview; сервер берёт размер упаковки из товара. kind и набор inputs должны соответствовать фасовке. Без фасовки — 400 packaging_unavailable; несовместимый вид — packaging_mismatch. Предел результата 1000000 упаковок, текущей закупки — 10000 единиц предложения.'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MaterialRequest'}}}
      responses:
        '201':
          description: Расчёт и покрытие упаковок
          content: {application/json: {schema: {$ref: '#/components/schemas/MaterialCalculation'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{id}/items/from-calculation:
    post:
      summary: Добавить пересчитанную сервером потребность в свой объект
      security: [{session: []}]
      description: 'Ключ хранится до удаления объекта. UUID приводится к нижнему регистру, defaults inputs заполнены, отсутствующая дата нормализуется в null. Одинаковый ключ и нормализованное тело возвращают исходный ответ; другое тело — 409 idempotency_conflict. После удаления позиции повтор — 409 calculation_item_deleted. Параллельные повторы сериализованы, позиция и ключ создаются одной транзакцией. Потребность допускает до 1000000 упаковок; лимит текущей закупки остаётся 10000.'
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$'}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FromCalculationRequest'}}}
      responses:
        '201':
          description: Позиция и исходный расчёт
          content: {application/json: {schema: {$ref: '#/components/schemas/FromCalculationResponse'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /calculators/tiles:
    post:
      summary: Расчёт плитки с округлением до упаковки
      description: Входы и вычисленный расход не превышают 1 000 000 000; количество упаковок — от 1 до 1 000 000. Переполнение и расход, исчезнувший при вычислении, отклоняются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areaM2, tileAreaM2, tilesPerPack]
              properties:
                areaM2: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
                tileAreaM2: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
                tilesPerPack: {type: integer, minimum: 1, maximum: 1000000000}
                wastePercent: {type: number, minimum: 0, maximum: 1000000000, default: 10}
      responses:
        '201': {description: Формула, расход и число упаковок, content: {application/json: {schema: {$ref: '#/components/schemas/Calculation'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /calculators/paint:
    post:
      summary: Расчёт краски с учётом слоёв
      description: Входы и вычисленный расход не превышают 1 000 000 000; количество упаковок — от 1 до 1 000 000. Переполнение и расход, исчезнувший при вычислении, отклоняются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areaM2, rateLPerM2, packSizeL]
              properties:
                areaM2: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
                rateLPerM2: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
                coats: {type: integer, minimum: 1, maximum: 1000000000, default: 2}
                packSizeL: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
                wastePercent: {type: number, minimum: 0, maximum: 1000000000, default: 10}
      responses:
        '201': {description: Формула, расход и число упаковок, content: {application/json: {schema: {$ref: '#/components/schemas/Calculation'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /calculators/dry-mix:
    post:
      summary: Расчёт сухой смеси по толщине слоя
      description: Входы и вычисленный расход не превышают 1 000 000 000; количество упаковок — от 1 до 1 000 000. Переполнение и расход, исчезнувший при вычислении, отклоняются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areaM2, layerMm, rateKgPerM2Mm, packSizeKg]
              properties:
                areaM2: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
                layerMm: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
                rateKgPerM2Mm: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
                packSizeKg: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000}
                wastePercent: {type: number, minimum: 0, maximum: 1000000000, default: 10}
      responses:
        '201': {description: Формула, расход и число упаковок, content: {application/json: {schema: {$ref: '#/components/schemas/Calculation'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /orders:
    get:
      summary: Заказы покупателя
      security: [{session: []}]
      responses: {'200': {description: История заказов}}
    post:
      summary: Создать заказ и транзакционно зарезервировать остатки
      security: [{session: []}]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$'}, description: 'Повтор с тем же ключом и телом возвращает тот же заказ; другое тело — 409'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Purchase'}}}
      responses: {'201': {description: Заказ и поставки по поставщикам, резерв на 30 минут}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /orders/{id}:
    get:
      summary: Собственный заказ
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Заказ, позиции и поставки, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /orders/{id}/demo-payment:
    post:
      summary: Учебное подтверждение оплаты без списания средств
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Обновлённый заказ}}
  /orders/{id}/cancel:
    post:
      summary: Отменить неоплаченный заказ и восстановить остатки
      description: Повторная отмена безопасна. Оплаченный заказ отменить нельзя. Истёкший резерв получает статус expired.
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Обновлённый заказ}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /dispatch/deliveries:
    get:
      summary: План поставок
      security: [{session: []}]
      responses: {'200': {description: Список поставок}}
  /dispatch/drivers:
    get:
      summary: Доступные водители для назначения
      security: [{session: []}]
      responses: {'200': {description: 'Массив объектов {id, name}'}}
  /dispatch/deliveries/{id}:
    patch:
      summary: Назначить водителя и дату
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverId]
              properties:
                driverId: {type: string, format: uuid}
                scheduledDate: {type: string, format: date}
      responses: {'200': {description: Назначенная поставка}}
  /driver/deliveries:
    get:
      summary: Рейсы текущего водителя
      security: [{session: []}]
      responses: {'200': {description: Список рейсов}}
  /driver/deliveries/{id}/events:
    post:
      summary: Следующий статус учебного рейса
      description: 'Допустимы assigned → picked_up → in_transit → delivered.'
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [picked_up, in_transit, delivered]}
      responses: {'201': {description: Новый статус}, '409': {$ref: '#/components/responses/Error'}}
  /reports/summary:
    get:
      summary: Сводка администратора по учебным данным
      security: [{session: []}]
      responses: {'200': {description: Количество и суммы заказов, статусы поставок}}
  /geo/config:
    get:
      summary: Режим карты и публичный ключ MapGL при наличии
      responses: {'200': {description: Источник карты}}
  /geo/suggest:
    get:
      summary: Адресные подсказки DaData или локального демо
      parameters: [{name: q, in: query, required: true, schema: {type: string, minLength: 2}}]
      responses: {'200': {description: source и массив items}, '502': {$ref: '#/components/responses/Error'}}
  /geo/route:
    get:
      summary: Маршрут 2ГИС или схематический маршрут демо
      parameters:
        - {name: fromLon, in: query, required: true, schema: {type: number}}
        - {name: fromLat, in: query, required: true, schema: {type: number}}
        - {name: toLon, in: query, required: true, schema: {type: number}}
        - {name: toLat, in: query, required: true, schema: {type: number}}
      responses: {'200': {description: 'Источник, координаты [долгота, широта], дистанция и время'}, '502': {$ref: '#/components/responses/Error'}}
